[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-infrastructure-monitoring"
version = "1.0.0"
description = "Lab-based infrastructure monitoring, incident management, SLA escalation, and Power BI reporting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Keerthana S."}]
dependencies = [
    "psutil>=5.9,<8",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
vmware = ["pyvmomi>=8.0,<10"]
visualization = ["matplotlib>=3.8,<4"]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "ruff>=0.6,<1",
]

[project.scripts]
infra-monitor = "infra_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
